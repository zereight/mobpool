[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mobpool"
version = "0.1.0"
description = "Unified iOS simulator and Android emulator pool, TTL lease, cap, and slimming manager for AI agents."
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
mobpool = "mobpool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
